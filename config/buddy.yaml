logging:
  enabled: true
  console_enabled: true
  file_enabled: true
  file_name: buddy.log
  max_bytes: 5242880
  backup_count: 5
  include_context: true
robot:
  id: buddy-001
  name: BUDDY
runtime:
  environment: robot
  log_level: INFO
  startup_mode: IDLE
timing:
  heartbeat_seconds: 2.0
  command_default_timeout_seconds: 1.0
movement:
  max_linear_speed_mps: null
  max_angular_speed_radps: null
  acceleration_limit_mps2: null
safety:
  obstacle_stop_distance_m: 0.25
  obstacle_caution_distance_m: 0.45
  command_timeout_seconds: 1.0
  connection_loss_stop_seconds: 1.0
hardware:
  enabled: false
  simulation: true
  gpio:
    numbering_mode: BCM
  motors:
    enabled: false
    pwm_frequency_hz: 1000
    driver_1:
      standby: 20
      front_left:
        in1: 5
        in2: 6
        pwm: 7
      front_right:
        in1: 8
        in2: 9
        pwm: 10
    driver_2:
      standby: 11
      rear_left:
        in1: 12
        in2: 13
        pwm: 16
      rear_right:
        in1: 17
        in2: 18
        pwm: 19
  ultrasonic:
    enabled: false
    timeout_seconds: 0.03
    inter_sensor_delay_seconds: 0.06
    minimum_distance_m: 0.02
    maximum_distance_m: 4.0
    filter_window: 3
    front_left:
      trigger: 21
      echo: 22
    front_right:
      trigger: 23
      echo: 24
    rear_left:
      trigger: 25
      echo: 26
    rear_right:
      trigger: 27
      echo: 14
camera:
  enabled: true
  width: 640
  height: 480
  fps: 15
audio:
  enabled: true
  wake_word: Buddy
  sample_rate_hz: 16000
vision:
  face_recognition_enabled: true
  emotion_recognition_enabled: true
network:
  local_api_enabled: true
  remote_access_enabled: false
storage:
  data_directory: runtime_data
  media_directory: runtime_media
  database_path: runtime_data/buddy.db
  log_directory: logs
features:
  voice: true
  vision: true
  movement: false
  navigation: false
  patrol: false
  security: false
  mobile_control: false

# Voice companion engine settings (Ashandth_Voice). Every key is optional.
profile: balanced        # lightweight | balanced | enhanced

audio:
  preferred_inputs: []   # substrings of device names; empty = auto-discover
  preferred_output: null
  max_microphones: 2
  allow_virtual_devices: false

microphones:
  switch_margin_db: 3.0
  min_dwell_s: 3.0
  fusion: "off"          # "off" or "sum" (sum only for a validated stereo device)
  fusion_geometry_validated: false

vad:
  start_margin_db: 9.0
  stop_margin_db: 5.0
  hangover_ms: 450

speaker:
  max_volume: 0.8
  default_volume: 0.6
  max_queue: 6

echo:
  guard_after_s: 0.35
  barge_in_enabled: true

models:                  # set on the robot; binaries are never committed
  vosk_model_path: ""
  piper_model_path: ""
  aplay_device: null     # null = derive from the discovered output device

memory:
  enabled: true
  db_path: "~/.buddy/companion.db"
  export_dir: "~/.buddy/exports"

features:                # profile "lightweight" turns these off
  emotion_audio: true
  backchannel: true
  proactive: true

online:                  # everything here is OFF by default
  cloud_enabled: false
  local_llm: false
  local_llm_model: "llama3.2:1b"
  local_llm_url: "http://127.0.0.1:11434"
  cloud_base_url: ""     # OpenAI-compatible endpoint; key comes from env
  cloud_model: ""
  cloud_api_key_env: "BUDDY_LLM_API_KEY"

navigation:              # enable only after the navigation package merges
  enabled: false
  locations: []

router:
  move_speed: 0.20
  turn_speed: 0.60
  max_motion_s: 8.0
  min_motion_confidence: 0.60

turn:
  awake_timeout_s: 60.0

personality_path: ""
